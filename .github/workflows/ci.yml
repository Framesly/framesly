name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Next generates the PageProps / LayoutProps types that typecheck needs.
      - name: Generate route types
        run: pnpm --filter @framesly/web exec next typegen

      - run: pnpm lint
      # Fails on hard-coded colours, z-index numbers and tiny font sizes (see scripts/check-design-tokens.mjs).
      - run: pnpm lint:design
      # Fails when a Darkroom colour pair drops below WCAG contrast targets (see scripts/check-contrast.mjs).
      - run: pnpm lint:contrast
      - run: pnpm typecheck
